<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Logowanie | My od Balonów</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{cream:'#FFFDF9',blush:'#F3C1C6',brown:'#4A3E3D',cocoa:'#6F5B59',champagne:'#F7E6CF'},fontFamily:{display:['Playfair Display','serif'],body:['Quicksand','sans-serif']}}}}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream text-brown font-body grid place-items-center p-5 bg-[radial-gradient(circle_at_top_left,rgba(243,193,198,.5),transparent_34%),radial-gradient(circle_at_bottom_right,rgba(247,230,207,.9),transparent_42%)]">
  <main class="w-full max-w-md rounded-[2rem] bg-white/90 border border-brown/10 shadow-2xl p-7 sm:p-9 backdrop-blur-xl">
    <div class="w-14 h-14 rounded-2xl bg-blush grid place-items-center text-2xl mb-6" aria-hidden="true">🎈</div>
    <p class="text-xs uppercase tracking-[.24em] text-cocoa font-bold">Panel administracyjny</p>
    <h1 class="font-display text-4xl font-bold mt-2">My od Balonów</h1>
    <p class="text-cocoa mt-3">Zaloguj się, aby zarządzać zleceniami i asortymentem.</p>

    <form id="loginForm" class="mt-8 space-y-5">
      <div>
        <label for="login" class="block text-sm font-bold mb-2">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+" class="w-full rounded-2xl border border-brown/15 bg-white px-4 py-3.5 outline-none focus:ring-2 focus:ring-blush" placeholder="np. zuza">
      </div>
      <div>
        <label for="password" class="block text-sm font-bold mb-2">Hasło</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" class="w-full rounded-2xl border border-brown/15 bg-white px-4 py-3.5 outline-none focus:ring-2 focus:ring-blush" placeholder="••••••••••••">
      </div>
      <p id="loginError" class="hidden rounded-xl bg-red-50 border border-red-200 text-red-700 p-3 text-sm font-semibold" role="alert"></p>
      <button id="loginButton" class="w-full rounded-full bg-brown text-cream py-4 font-bold hover:bg-cocoa transition disabled:opacity-60">Zaloguj się</button>
    </form>
    <a href="/" class="mt-6 inline-flex text-sm font-bold text-cocoa hover:text-brown">← Wróć do strony</a>
  </main>
  <script>
    const form=document.getElementById('loginForm');
    const errorBox=document.getElementById('loginError');
    const button=document.getElementById('loginButton');
    fetch('/api/auth?action=session',{credentials:'same-origin'})
      .then(async response => {
        if (!response.headers.get('content-type')?.includes('application/json')) {
          throw new Error('Serwer logowania nie zwrócił prawidłowej odpowiedzi. Sprawdź konfigurację panelu na hostingu.');
        }
        const session = await response.json();
        if(response.ok && session.authenticated === true) location.replace('/admin');
      })
      .catch(error => {
        errorBox.textContent = error.message || 'Nie można połączyć się z serwerem logowania.';
        errorBox.classList.remove('hidden');
      });
    form.addEventListener('submit',async event=>{
      event.preventDefault(); errorBox.classList.add('hidden'); button.disabled=true; button.textContent='Logowanie…';
      try{
        const response=await fetch('/api/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({login:form.login.value,password:form.password.value})});
        if (!response.headers.get('content-type')?.includes('application/json')) throw new Error('Serwer logowania nie jest dostępny. Sprawdź konfigurację panelu na hostingu.');
        const data=await response.json(); if(!response.ok)throw new Error(data.error||'Nie udało się zalogować.'); location.replace('/admin');
      }catch(error){errorBox.textContent=error.message;errorBox.classList.remove('hidden');button.disabled=false;button.textContent='Zaloguj się'}
    });
  </script>
</body>
</html>
